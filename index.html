}

var prevSaveT = null, footT = null;

function prevInput(el) {
  var p = S.prev; if (!p) return false;
  if (el.dataset.pz) { lsSet('rm_azienda', el.value); return true; }
  if (el.dataset.pcond) { condDi(p)[el.dataset.pcond] = el.value; var cp = $('#cond-prev'); if (cp) cp.textContent = condLine(p); queuePrevSave(); return true; }
  if (el.dataset.pcondx) { var kx = el.dataset.pcondx.split('.'); condDi(p).extra[Number(kx[0])][kx[1]] = el.value; var cp2 = $('#cond-prev'); if (cp2) cp2.textContent = condLine(p); queuePrevSave(); return true; }
  if (el.dataset.pz2) { p.footer = el.value; queuePrevSave(); return true; }
  if (false) { S.home.footer = el.value; clearTimeout(footT); footT = setTimeout(function () { dbPut('impostazioni', { id: 'home', titolo: S.home.titolo || '', dati: S.home.dati, logo: S.home.logo || '', footer: S.home.footer }).catch(function () {}); }, 500); return true; }
  if (el.dataset.ptt) { p.tabTotShow = p.tabTotShow || {}; p.tabTotShow[el.dataset.ptt] = el.checked; queuePrevSave(); return true; }
  if (el.dataset.pt) { p.tabTit = p.tabTit || {}; p.tabTit[el.dataset.pt] = el.value; queuePrevSave(); return true; }
  var f = el.dataset.pf; if (!f) return false;
  var row = el.closest('[data-ri]');
  if (row) {
    var i = Number(row.dataset.ri), r = p.righe[i]; if (!r) return true;
    if (f === 'desc' || f === 'prezzoExpr' || f === 'dove' || f === 'head' || f === 'head0' || f === 'magLabel') r[f] = el.value;
    else if (f === 'tab') { r.tab = Number(el.value) || 1; for (var kk = i + 1; kk < p.righe.length && p.righe[kk].sub && p.righe[kk].pid === r.id; kk++) p.righe[kk].tab = r.tab; savePrev(); viewPreventivo(); return true; }
    else if (f === 'linea') r.noLine = !el.checked;

    var c = rigaCalc(r, p);
    Array.prototype.forEach.call(document.querySelectorAll('[data-rt]'), function (e2) { var r2 = p.righe[Number(e2.dataset.rt)]; if (r2) e2.textContent = fmtEur(rigaCalc(r2, p).tot); });

  else p[f] = el.value;

/* ---------- PDF del preventivo (pdf-lib, caricato da internet al primo uso) ---------- */
var PDFLIB = null;
function loadPdfLib() {
  if (window.PDFLib) return Promise.resolve(window.PDFLib);
  if (PDFLIB) return PDFLIB;
  PDFLIB = new Promise(function (res, rej) {
    var s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js';
    s.onload = function () { window.PDFLib ? res(window.PDFLib) : rej(new Error('pdf-lib')); };
    s.onerror = function () { PDFLIB = null; rej(new Error('pdf-lib')); };
    document.head.appendChild(s);
  });

      } catch (xo) { toast('Non riesco ad aprire il PDF.'); }
      break;
    case 'newcliente': sheetCliente(null); break;
    case 'newcartella': sheetCartella(null); break;
    case 'editcartella': sheetCartella(S.cartella ? cartellaDi(S.cartella) : null); break;
    case 'editcliente': sheetCliente(S.cliente); break;
    case 'newril': sheetNewRil(); break;
    case 'gosec': var sc = $('#sec2'); if (sc) sc.scrollIntoView({ behavior: 'smooth', block: 'start' }); break;
    case 'gotop': window.scrollTo({ top: 0, behavior: 'smooth' }); break;
    case 'pgprev': pagGo((S.ril.pagCur || 0) - 1); break;
    case 'pgnext': pagGo((S.ril.pagCur || 0) + 1); break;
    case 'pgnew': pagSync(S.ril); S.ril.pagine.splice((S.ril.pagCur || 0) + 1, 0, { tratti: [], quote: [], note: [] }); pagGo((S.ril.pagCur || 0) + 1); break;
    case 'pgdel':
      if (S.ril.pagine.length > 1) {
        if (t.dataset.armed) {
          var ci = S.ril.pagCur || 0, rr = S.ril;
          rr.pagine.splice(ci, 1); var ni = Math.max(0, ci - 1); rr.pagCur = ni; rr.pagine[ni] = rr.pagine[ni] || {};
          var pq = rr.pagine[ni]; rr.tratti = pq.tratti || []; rr.quote = pq.quote || []; rr.note = pq.note || [];
          pagGo(ni); toast('Pagina eliminata.');
        } else {
          t.dataset.armed = '1'; var oldT = t.textContent; t.textContent = 'Conferma';
          setTimeout(function () { delete t.dataset.armed; t.textContent = oldT; }, 3500);
        }
      }
      break;
    case 'undo': if (S.ril.tratti && S.ril.tratti.length) { S.ril.tratti.pop(); queueSave(); redraw(); } break;
    case 'addins': sheetAddIns(); break;
    case 'delins':
      if (t.dataset.armed) {
        var di = S.ril, dp = S.parent;
        dp.ril.insets = dp.ril.insets.filter(function (x) { return x !== di; });
        try { await dbDel('foto', di.id); } catch (x) {}
        delete S.insImgs[di.id];
        S.parent = null; S.ril = dp.ril; S.img = dp.img; S.selId = null; S.mode = 'quota'; resetView();
        await flush(); render(); toast('Particolare eliminato.');
      } else {
        t.dataset.armed = '1'; var old2 = t.textContent; t.textContent = 'Tocca di nuovo per eliminare';
        setTimeout(function () { delete t.dataset.armed; t.textContent = old2; }, 3500);
      }
      break;
    case 'backup': await backup(); break;
    case 'sbopen': sheetSync(); break;
    case 'sbnow': await syncNow(true); break;
    case 'sbout': sbSave(null); syncSt.ts = 0; syncSt.err = ''; toast('Uscito. I dati restano su questo dispositivo.'); if (S.view === 'home') viewHome(); break;
    case 'export': await exportScheda(); break;
    case 'zin': if (view) zoomAt(view.W / 2, view.H / 2, Z.z * 1.5); break;
    case 'zout': if (view) zoomAt(view.W / 2, view.H / 2, Z.z / 1.5); break;
    case 'zreset': if (view) zoomAt(view.W / 2, view.H / 2, zBase()); break;
    case 'delril':
      if (t.dataset.armed) {
        var id = S.ril.id;
        try { var is = S.ril.insets || []; for (var kk = 0; kk < is.length; kk++) await dbDel('foto', is[kk].id); await dbDel('rilievi', id); await dbDel('foto', id); } catch (x) {}
        await loadAll(); S.ril = null; S.view = 'cliente'; render(); toast('Rilievo eliminato.');
      } else {
        t.dataset.armed = '1'; var old = t.textContent; t.textContent = 'Tocca di nuovo per eliminare';
        setTimeout(function () { delete t.dataset.armed; t.textContent = old; }, 3500);
      }
      break;
  }
});
